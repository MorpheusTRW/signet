<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Signet feed with live radar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&amp;family=DM+Sans:wght@400;500;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0;background:#0E0E10}
a{color:#FF5B2E}a:hover{color:#FF7A55}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0E10; color: #F2EEE6; font-family: 'DM Sans', Arial, sans-serif; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 8px">
<div style="font-family: 'Unbounded', Arial, sans-serif; font-size: 22px; font-weight: 600; letter-spacing: -0.5px">signet</div>
<div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 2px; color: #0E0E10; background: {{accent}}; padding: 6px 10px; border-radius: 999px">PRO</div>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 8px 20px 20px">
<svg viewBox="0 0 200 200" width="200" height="200" aria-label="Live radar scanning new launches">
<g fill="none" stroke-linecap="round">
<circle cx="100" cy="100" r="92" stroke="#1C1C20" stroke-width="2"></circle>
<circle cx="100" cy="100" r="72" stroke="#2A2A30" stroke-width="5" stroke-dasharray="120 40 230 62" transform="rotate(-60 100 100)"></circle>
<circle cx="100" cy="100" r="60" stroke="#2A2A30" stroke-width="5" stroke-dasharray="250 34 60 33" transform="rotate(-110 100 100)"></circle>
<circle cx="100" cy="100" r="48" stroke="{{accent}}" stroke-opacity="0.45" stroke-width="5" stroke-dasharray="210 26 50 16" transform="rotate(-80 100 100)"></circle>
<circle cx="100" cy="100" r="36" stroke="{{accent}}" stroke-opacity="0.7" stroke-width="5" stroke-dasharray="160 22 36 8" transform="rotate(-120 100 100)"></circle>
<circle cx="100" cy="100" r="24" stroke="{{accent}}" stroke-width="5" stroke-dasharray="118 33" transform="rotate(-70 100 100)"></circle>
<circle cx="100" cy="100" r="12" stroke="{{accent}}" stroke-width="5" stroke-dasharray="52 24" transform="rotate(-100 100 100)"></circle>
<path d="M100 100 L100 8" stroke="{{accent}}" stroke-width="2" stroke-opacity="0.6"></path>
<circle cx="152" cy="62" r="5" fill="{{accent}}" stroke="none"></circle>
</g>
</svg>
<div style="display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 1px; color: #B3AEA5">
<svg viewBox="0 0 10 10" width="8" height="8" aria-hidden="true"><circle cx="5" cy="5" r="5" fill="{{accent}}"></circle></svg>
LIVE · 1,284 scanned today · 1,261 rejected
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; margin: 0 16px; padding: 18px; background: #1A1A1E; border: 1px solid {{accent}}; border-radius: 22px; box-shadow: 0 0 40px rgba(255,91,46,0.18)">
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 2px; color: {{accent}}">NEW SIGNAL · 12s</div>
<div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #F2EEE6; border: 1px solid #F2EEE6; padding: 4px 8px; border-radius: 999px">Risk: Low</div>
</div>
<div style="font-family: 'Unbounded', Arial, sans-serif; font-size: 24px; font-weight: 600">$TOKEN</div>
<div style="font-family: 'JetBrains Mono', monospace; font-size: 15px; line-height: 1.5; color: #F2EEE6">New Meteora pool. Clean dev. 3 sniper wallets.</div>
<button type="button" style="height: 56px; border: none; border-radius: 16px; background: {{accent}}; color: #0E0E10; font-family: 'Unbounded', Arial, sans-serif; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px">
<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="#0E0E10" stroke-width="2" stroke-linecap="round"><path d="M12 4a8 8 0 0 0-8 8"></path><path d="M12 4a8 8 0 0 1 8 8v2"></path><path d="M8 12a4 4 0 0 1 8 0v3"></path><path d="M12 12v6"></path><path d="M8 15v2"></path></svg>
Approve Entry · 0.2 SOL
</button>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 20px 20px 0; flex-grow: 1">
<div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 2px; color: #B3AEA5">JUST REJECTED</div>
<div style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #2A2A30; font-size: 15px">
<div>$TOKEN_B</div>
<div style="color: #B3AEA5">Top 10 hold 61%</div>
</div>
<div style="display: flex; justify-content: space-between; padding: 12px 0; font-size: 15px">
<div>$TOKEN_C</div>
<div style="color: #B3AEA5">Freeze authority on</div>
</div>
</div>
<nav style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid #2A2A30; padding: 8px 8px 20px">
<button type="button" style="height: 52px; background: transparent; border: none; color: {{accent}}; font-family: 'DM Sans', Arial, sans-serif; font-size: 12px; font-weight: 700">Feed</button>
<button type="button" style="height: 52px; background: transparent; border: none; color: #B3AEA5; font-family: 'DM Sans', Arial, sans-serif; font-size: 12px">Dodged</button>
<button type="button" style="height: 52px; background: transparent; border: none; color: #B3AEA5; font-family: 'DM Sans', Arial, sans-serif; font-size: 12px">Recap</button>
<button type="button" style="height: 52px; background: transparent; border: none; color: #B3AEA5; font-family: 'DM Sans', Arial, sans-serif; font-size: 12px">Settings</button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF5B2E","options":["#FF5B2E","#C8FF3D","#9B7BFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#FF5B2E' };
}
}
</script>
</body>
</html>
