<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Signet weekly recap to share</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&amp;family=DM+Sans:wght@400;500;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0;background:#0E0E10}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0E10; color: #F2EEE6; font-family: 'DM Sans', Arial, sans-serif; display: flex; flex-direction: column; padding: 28px 20px; gap: 20px">
<div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 2px; color: #B3AEA5">YOUR WEEK · SHARE IT</div>
<div style="display: flex; flex-direction: column; gap: 22px; background: {{accent}}; color: #0E0E10; border-radius: 28px; padding: 26px; position: relative; overflow: hidden">
<svg viewBox="0 0 200 200" width="260" height="260" aria-hidden="true" style="position: absolute; right: -80px; top: -60px">
<g fill="none" stroke="#0E0E10" stroke-opacity="0.14" stroke-width="7" stroke-linecap="round">
<circle cx="100" cy="100" r="24" stroke-dasharray="118 33" transform="rotate(-70 100 100)"></circle>
<circle cx="100" cy="100" r="48" stroke-dasharray="210 26 50 16" transform="rotate(-80 100 100)"></circle>
<circle cx="100" cy="100" r="72" stroke-dasharray="120 40 230 62" transform="rotate(-60 100 100)"></circle>
<circle cx="100" cy="100" r="96" stroke-dasharray="180 44 290 90" transform="rotate(-40 100 100)"></circle>
</g>
</svg>
<div style="font-family: 'Unbounded', Arial, sans-serif; font-size: 20px; font-weight: 600; position: relative">signet · week 40</div>
<div style="display: flex; flex-direction: column; gap: 4px; position: relative">
<div style="font-family: 'Unbounded', Arial, sans-serif; font-size: 72px; font-weight: 600; line-height: 1; letter-spacing: -3px">23</div>
<div style="font-size: 18px; font-weight: 700">rugs dodged</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; position: relative">
<div style="display: flex; flex-direction: column; gap: 2px; background: #0E0E10; color: #F2EEE6; border-radius: 16px; padding: 14px">
<div style="font-family: 'Unbounded', Arial, sans-serif; font-size: 28px; font-weight: 600">9</div>
<div style="font-size: 13px; color: #B3AEA5">signals approved</div>
</div>
<div style="display: flex; flex-direction: column; gap: 2px; background: #0E0E10; color: #F2EEE6; border-radius: 16px; padding: 14px">
<div style="font-family: 'Unbounded', Arial, sans-serif; font-size: 28px; font-weight: 600">7d</div>
<div style="font-size: 13px; color: #B3AEA5">discipline streak</div>
</div>
</div>
<div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 2px; position: relative">BUILT FOR SOLANA SEEKER</div>
</div>
<div style="flex-grow: 1"></div>
<button type="button" style="height: 56px; border: none; border-radius: 16px; background: #F2EEE6; color: #0E0E10; font-family: 'Unbounded', Arial, sans-serif; font-size: 16px; font-weight: 600">Share on X</button>
<button type="button" style="height: 52px; border: 1px solid #3A3A42; border-radius: 16px; background: transparent; color: #F2EEE6; font-family: 'DM Sans', Arial, sans-serif; font-size: 15px">Save image</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF5B2E","options":["#FF5B2E","#C8FF3D","#9B7BFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#FF5B2E' };
}
}
</script>
</body>
</html>
