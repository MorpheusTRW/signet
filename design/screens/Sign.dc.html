<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Signet signing and seal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&amp;family=DM+Sans:wght@400;500;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0;background:#0E0E10}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0E10; color: #F2EEE6; font-family: 'DM Sans', Arial, sans-serif; display: flex; flex-direction: column; padding: 24px 20px 28px; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 2px; color: #B3AEA5">APPROVE ENTRY · $TOKEN</div>
<div style="font-family: 'Unbounded', Arial, sans-serif; font-size: 44px; font-weight: 600; letter-spacing: -1.5px">0.2 SOL</div>
</div>
<div style="display: flex; flex-direction: column; background: #1A1A1E; border: 1px solid #2A2A30; border-radius: 18px; padding: 4px 16px">
<div style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #2A2A30; font-size: 15px"><div style="color: #B3AEA5">Platform fee</div><div>0.5% · 0.001 SOL</div></div>
<div style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #2A2A30; font-size: 15px"><div style="color: #B3AEA5">Max slippage</div><div>10%</div></div>
<div style="display: flex; justify-content: space-between; padding: 12px 0; font-size: 15px"><div style="color: #B3AEA5">On-device check</div><div>Passed</div></div>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px">
<sc-if value="{{notSigned}}" hint-placeholder-val="{{ true }}">
<svg viewBox="0 0 200 200" width="220" height="220" aria-label="Fingerprint, waiting for signature">
<g fill="none" stroke-width="7" stroke-linecap="round">
<circle cx="100" cy="100" r="12" stroke="{{accent}}" stroke-dasharray="52 24" transform="rotate(-100 100 100)"></circle>
<circle cx="100" cy="100" r="24" stroke="{{accent}}" stroke-dasharray="118 33" transform="rotate(-70 100 100)"></circle>
<circle cx="100" cy="100" r="36" stroke="{{accent}}" stroke-dasharray="160 22 36 8" transform="rotate(-120 100 100)"></circle>
<circle cx="100" cy="100" r="48" stroke="#3A3A42" stroke-dasharray="210 26 50 16" transform="rotate(-80 100 100)"></circle>
<circle cx="100" cy="100" r="60" stroke="#3A3A42" stroke-dasharray="250 34 60 33" transform="rotate(-110 100 100)"></circle>
<circle cx="100" cy="100" r="72" stroke="#3A3A42" stroke-dasharray="120 40 230 62" transform="rotate(-60 100 100)"></circle>
</g>
</svg>
<div style="font-size: 17px; color: #B3AEA5; text-align: center">Touch the sensor to sign with Seed Vault</div>
</sc-if>
<sc-if value="{{signed}}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 200 200" width="220" height="220" aria-label="Seal: transaction signed">
<circle cx="100" cy="100" r="96" fill="{{accent}}"></circle>
<circle cx="100" cy="100" r="85" fill="none" stroke="#0E0E10" stroke-opacity="0.25" stroke-width="2"></circle>
<g fill="none" stroke="#0E0E10" stroke-width="7" stroke-linecap="round">
<circle cx="100" cy="100" r="12" stroke-dasharray="52 24" transform="rotate(-100 100 100)"></circle>
<circle cx="100" cy="100" r="24" stroke-dasharray="118 33" transform="rotate(-70 100 100)"></circle>
<circle cx="100" cy="100" r="36" stroke-dasharray="160 22 36 8" transform="rotate(-120 100 100)"></circle>
<circle cx="100" cy="100" r="48" stroke-dasharray="210 26 50 16" transform="rotate(-80 100 100)"></circle>
<circle cx="100" cy="100" r="60" stroke-dasharray="250 34 60 33" transform="rotate(-110 100 100)"></circle>
<circle cx="100" cy="100" r="72" stroke-dasharray="120 40 230 62" transform="rotate(-60 100 100)"></circle>
</g>
</svg>
<div style="font-family: 'Unbounded', Arial, sans-serif; font-size: 22px; font-weight: 600">Sealed.</div>
<div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #B3AEA5; text-align: center">Confirmed on-chain · [TIME]s</div>
</sc-if>
</div>
<button type="button" onClick="{{toggle}}" style="height: 56px; border: 1px solid #3A3A42; border-radius: 16px; background: transparent; color: #F2EEE6; font-family: 'DM Sans', Arial, sans-serif; font-size: 15px; font-weight: 500">{{buttonLabel}}</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF5B2E","options":["#FF5B2E","#C8FF3D","#9B7BFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { signed: false };
}
renderVals() {
const signed = this.state.signed;
return {
accent: this.props.accent ?? '#FF5B2E',
signed: signed,
notSigned: !signed,
buttonLabel: signed ? 'Back to feed' : 'Simulate fingerprint',
toggle: () => this.setState({ signed: !signed })
};
}
}
</script>
</body>
</html>
